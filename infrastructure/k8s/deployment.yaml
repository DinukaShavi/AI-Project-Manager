apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-tpm-backend-deployment
  namespace: production
  labels:
    app: ai-tpm-backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: ai-tpm-backend
  template:
    metadata:
      labels:
        app: ai-tpm-backend
    spec:
      containers:
      - name: fastapi-server
        image: 123456789012.dkr.ecr.us-east-1.amazonaws.com/ai-tpm-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: ENVIRONMENT
          value: "production"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: ai-tpm-secrets
              key: DATABASE_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: ai-tpm-secrets
              key: REDIS_URL
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-tpm-backend-service
  namespace: production
spec:
  type: ClusterIP
  selector:
    app: ai-tpm-backend
  ports:
  - port: 8000
    targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-tpm-backend-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-tpm-backend-deployment
  minReplicas: 4
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
